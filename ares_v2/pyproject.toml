[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ares"
version = "2.0.0"
description = "Autonomous Real-time Evaluation System for Multi-Modal Misinformation Verification"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
authors = [
    { name = "Gurarpit Singh" }
]
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "pandas>=2.1.0",
    "pyarrow>=14.0.0",
    "scikit-learn>=1.3.0",
    "statsmodels>=0.14.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "pydantic>=2.5.0",
    "pyyaml>=6.0.1",
    "tqdm>=4.66.0",
    "rich>=13.7.0",
    "pytest>=7.4.0",
    "ruff>=0.1.9",
    "torch>=2.2.0",
    "transformers>=4.38.0",
    "accelerate>=0.27.0",
    "peft>=0.8.0",
    "datasets>=2.16.0",
    "sentence-transformers>=2.3.0",
    "faiss-cpu>=1.7.4",
    "jsonschema>=4.20.0",
    "ijson>=3.2.3",
]

[project.optional-dependencies]
vision = [
    "timm>=0.9.12",
    "opencv-python-headless>=4.9.0",
]
audio = [
    "torchaudio>=2.2.0",
    "librosa>=0.10.1",
]
graph = [
    "networkx>=3.2.1",
]
geo = [
    "spacy>=3.7.2",
    "geopy>=2.4.1",
]
service = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ares"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
