# ARES-Bench Dataset Registry
# Master data configuration for all Tier-1 and Tier-2 datasets.

tier_1:
  liar:
    name: "LIAR"
    tier: 1
    track: "T1"
    version: "1.0"
    homepage: "https://www.cs.ucsb.edu/~william/data/liar_dataset.zip"
    licence: "CC-BY-SA-4.0"
    redistribution: "yes"
    access: "open"
    citation: "Wang (ACL 2017)"
    expected_counts:
      train: 10269
      val: 1284
      test: 1283
      total: 12836
    labels: ["pants-fire", "false", "barely-true", "half-true", "mostly-true", "true"]
    est_size_gb: 0.05
    raw_retention: "keep"

  fever:
    name: "FEVER"
    tier: 1
