# Configuration for M07 EfficientNet-B4 Detector (Modern Reference)
experiment_id: "M07-deepfake-efficientnet"
milestone: "M07"
architecture: "efficientnet_b4"
pretrained: true
dropout: 0.3

data:
  image_size: 224
  fps_sample_rate: 2
  batch_size: 32
  num_workers: 4
  balanced_sampling: true

training:
  optimizer: "AdamW"
  learning_rate: 0.0002
  weight_decay: 0.0001
  epochs: 10
  patience: 3
  precision: "bf16"

evaluation:
  metric: "video_roc_auc"
  bootstrap_resamples: 10000
  threshold_criteria: ["youden", "fixed_fpr_5", "fixed_fpr_1"]
  primary_threshold: "youden"
